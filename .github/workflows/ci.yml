name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # gridflow comes from the git source backend/uv.lock pins, exactly as a fresh
  # clone gets it. gridflow is public, so the install needs no token.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      # pyproject <-> uv.lock drift fails here, before anything installs.
      - name: Lockfile drift gate
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Test
        run: uv run pytest -x -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint
